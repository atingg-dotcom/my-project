name: hand_sign_app
description: Hand sign recognition starter trained from your own dataset.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:

  flutter:
    sdk: flutter
  camera: 0.12.1
  tflite_flutter: ^0.12.0
  image: ^4.2.0
  permission_handler: ^11.3.1
  hand_landmarker: 3.1.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model.tflite
    - assets/labels.txt
